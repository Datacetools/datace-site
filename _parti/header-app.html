<!-- DATACE HEADER APP START -->
<header style="background:rgba(6,14,31,.85);border-bottom:1px solid rgba(255,255,255,.07);backdrop-filter:blur(16px);" class="sticky top-0 z-50">
  <div class="max-w-4xl mx-auto px-6 py-3 flex items-center gap-3">

    <!-- Logo Datace -->
    <a href="https://datacetools.com" class="flex items-center gap-3 shrink-0">
      <svg class="w-9 h-9" viewBox="0 0 48 48" fill="none">
        <defs>
          <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#FBBF24"/></linearGradient>
          <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0f2040"/><stop offset="100%" stop-color="#1c3461"/></linearGradient>
        </defs>
        <rect width="48" height="48" rx="12" fill="url(#iconBg)"/>
        <rect class="logo-bar logo-bar-1" x="10" y="11" width="28" height="6" rx="3" fill="url(#sg)"/>
        <rect class="logo-bar logo-bar-2" x="10" y="21" width="20" height="6" rx="3" fill="white"/>
        <rect class="logo-bar logo-bar-3" x="10" y="31" width="12" height="6" rx="3" fill="white" fill-opacity="0.35"/>
      </svg>
      <div class="flex flex-col leading-tight">
        <span style="color:white;" class="text-lg font-bold tracking-widest uppercase">Datace</span>
        <span style="color:rgba(255,255,255,.62);" class="text-[9px] font-medium tracking-[0.2em] uppercase">Documenti in dati strutturati</span>
      </div>
    </a>

    <!-- Separatore + tool name -->
    <div style="width:1px;height:32px;background:rgba(255,255,255,.1);" class="mx-2 hidden sm:block"></div>
    <div class="hidden sm:flex flex-col leading-tight">
      <span style="color:white;font-weight:700;font-size:15px;">{{nome}}</span>
      <span style="color:var(--muted);font-size:11px;">{{sotto}}</span>
    </div>

    <!-- Privacy badge -->
    <div class="ml-auto hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full" style="background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);">
      <svg class="w-3 h-3" style="color:#86efac;" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
      </svg>
      <span style="color:#86efac;font-size:11px;font-weight:600;">Resta sul tuo computer</span>
    </div>
  </div>
</header>
<!-- DATACE HEADER APP END -->
